services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: margin
      POSTGRES_PASSWORD: margin
      POSTGRES_DB: margin_engine
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U margin -d margin_engine"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - margin_pg:/var/lib/postgresql/data
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://margin:margin@postgres:5432/margin_engine
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: info,sqlx=warn
      MARGIN_LOG_FORMAT: json
    ports:
      - "8080:8080"

volumes:
  margin_pg:
