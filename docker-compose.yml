services:
  postgres:
    image: postgres:16
    env_file:
      - path: ./config/compose.env
        required: true
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U margin -d margin_engine"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - margin_pg:/var/lib/postgresql/data
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ./config/compose.env
        required: true
    ports:
      - "8080:8080"

volumes:
  margin_pg:
